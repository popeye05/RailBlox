# Run behind an HTTPS ingress. One API process and one database per division.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      AUTH_MODE: supabase
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    stop_grace_period: 90s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
